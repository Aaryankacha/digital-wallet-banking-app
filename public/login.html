<div class="card">
    <h2>Login</h2>
    <div ng-if="errorMessage" class="error">{{errorMessage}}</div>
    <form ng-submit="login()">
        <div class="form-group">
            <label>Email</label>
            <input type="email" ng-model="user.email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" ng-model="user.password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <p>Don't have an account? <a href="#!/register">Register here</a></p>
</div>
