<!DOCTYPE html>
<html lang="en" ng-app="walletApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Wallet Banking System</title>
    <!-- AngularJS CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1>Digital Wallet</h1>
            <nav ng-if="currentUser">
                <span>Welcome, {{currentUser.name}}</span>
                <button ng-click="logout()" class="btn-logout">Logout</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Where templates will be loaded -->
        <div ng-view></div>
    </main>

    <footer class="main-footer">
        <p>&copy; 2024 Digital Wallet System. All rights reserved.</p>
    </footer>

    <!-- App Scripts -->
    <script src="app.js"></script>
</body>
</html>
