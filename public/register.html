<div class="card">
    <h2>Register</h2>
    <div ng-if="errorMessage" class="error">{{errorMessage}}</div>
    <form ng-submit="register()">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" ng-model="user.name" placeholder="Enter your name" required>
        </div>
        <div class="form-group">
            <label>Email (Username)</label>
            <input type="email" ng-model="user.email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" ng-model="user.password" placeholder="Create a password" required>
        </div>
        <button type="submit" class="btn btn-primary">Create Account</button>
    </form>
    <p>Already have an account? <a href="#!/login">Login here</a></p>
</div>
